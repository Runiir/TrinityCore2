    - experiments/configs/wowsims_cata_p4_gear_profiles.json
    - experiments/configs/cata_434_action_profiles.json
    - data/dbc/enUS/Talent.dbc
    - data/dbc/enUS/TalentTreePrimarySpells.dbc
    - data/dbc/enUS/GlyphProperties.dbc
    - data/dbc/enUS/Item-sparse.db2
    - data/dbc/enUS/GemProperties.dbc
