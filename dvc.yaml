stages:
  world_knowledge:
    cmd: python -m tools.bot_ml.extract_world_knowledge --output-dir dataset/world_knowledge
    deps:
    - tools/bot_ml/extract_world_knowledge.py
    - tools/bot_ml/common.py
    outs:
    - dataset/world_knowledge:
        persist: true
  world_planner:
    cmd: python -m tools.bot_ml.build_world_planner_manifests --world-dir dataset/world_knowledge --output-dir dataset/world_planner
    deps:
    - tools/bot_ml/build_world_planner_manifests.py
    - tools/bot_ml/common.py
    - dataset/world_knowledge
    outs:
    - dataset/world_planner:
        persist: true
  world_planner_validate:
    cmd: python -m tools.bot_ml.validate_world_planner --planner-dir dataset/world_planner --validation-scenario-dir dataset/validation_scenarios --report dataset/world_validation/planner_report.json
    deps:
    - tools/bot_ml/validate_world_planner.py
    - tools/bot_ml/common.py
    - dataset/world_planner
    - dataset/validation_scenarios
    metrics:
    - dataset/world_validation/planner_report.json:
        cache: false
  validation_gear:
    cmd: python -m tools.bot_ml.build_validation_gear_profiles --config experiments/configs/validation_provisioning_cata_001.json --output-dir dataset/validation_gear_profiles
    deps:
    - tools/bot_ml/build_validation_gear_profiles.py
    - tools/bot_ml/build_validation_provisioning.py
    - tools/bot_ml/extract_world_knowledge.py
    - experiments/configs/validation_provisioning_cata_001.json
    - data/dbc/enUS/Item.db2
    - data/dbc/enUS/Item-sparse.db2
    - data/dbc/enUS/SpellItemEnchantment.dbc
    - data/dbc/enUS/GemProperties.dbc
    outs:
    - dataset/validation_gear_profiles:
        persist: true
  validation_provisioning:
    cmd: python -m tools.bot_ml.build_validation_provisioning --config experiments/configs/validation_provisioning_cata_001.json --gear-profiles dataset/validation_gear_profiles/profiles.json --output-dir dataset/validation_provisioning
    deps:
    - tools/bot_ml/build_validation_provisioning.py
    - experiments/configs/validation_provisioning_cata_001.json
    - dataset/validation_gear_profiles
    outs:
    - dataset/validation_provisioning:
        persist: true
  validation_provisioning_verify:
    cmd: python -m tools.bot_ml.validate_validation_provisioning --config experiments/configs/validation_provisioning_cata_001.json --gear-profiles dataset/validation_gear_profiles/profiles.json --provisioning-report dataset/validation_provisioning/report.json --output dataset/validation_provisioning_verification/report.json
    deps:
    - tools/bot_ml/validate_validation_provisioning.py
    - tools/bot_ml/build_validation_gear_profiles.py
    - tools/bot_ml/build_validation_provisioning.py
    - tools/bot_ml/extract_world_knowledge.py
    - experiments/configs/validation_provisioning_cata_001.json
    - dataset/validation_gear_profiles
    - dataset/validation_provisioning/report.json
    - data/dbc/enUS/Item.db2
    - data/dbc/enUS/Item-sparse.db2
    - data/dbc/enUS/SpellItemEnchantment.dbc
    - data/dbc/enUS/GemProperties.dbc
    metrics:
    - dataset/validation_provisioning_verification/report.json:
        cache: false
  validation_scenarios:
    cmd: python -m tools.bot_ml.build_validation_scenario_manifests --config experiments/configs/validation_scenarios_cata_001.json --provisioning-report dataset/validation_provisioning/report.json --provisioning-verification dataset/validation_provisioning_verification/report.json --output-dir dataset/validation_scenarios
    deps:
    - tools/bot_ml/build_validation_scenario_manifests.py
    - tools/bot_ml/common.py
    - experiments/configs/validation_scenarios_cata_001.json
    - dataset/validation_provisioning/report.json
    - dataset/validation_provisioning_verification/report.json
    outs:
    - dataset/validation_scenarios:
        persist: true
  live_scenario_reports:
    cmd: python -m tools.bot_ml.build_live_scenario_reports --live-report dataset/live_validation_scenario_reports/report.json --validation-scenario-dir dataset/validation_scenarios --output-dir dataset/live_validation_scenario_reports_built
    deps:
    - tools/bot_ml/build_live_scenario_reports.py
    - tools/bot_ml/run_live_bot_validation.py
    - tools/bot_ml/common.py
    - dataset/live_validation_scenario_reports/report.json
    - dataset/validation_scenarios
    outs:
    - dataset/live_validation_scenario_reports_built:
        persist: true
  capture:
    cmd: python experiments/run_experiment.py ${capture.config} --raw-dir 
      dataset/raw --runs-dir experiments/runs --live-dir ${tracking.live_dir} 
      --local
    deps:
    - experiments/run_experiment.py
    - ${capture.config}
    outs:
    - dataset/raw:
        persist: true
    - experiments/runs:
        persist: true
    - ${tracking.live_dir}:
        persist: true
  preprocess:
    cmd: python ml/preprocessing/preprocess_frames.py --raw-dir 
      ${preprocess.raw_dir} --output ${preprocess.output} --manifest 
      ${preprocess.manifest}
    deps:
    - ml/preprocessing/preprocess_frames.py
    - ${preprocess.raw_dir}
    outs:
    - ${preprocess.output}
    - ${preprocess.manifest}
  train:
    cmd: python ml/training/train_action_frequency.py --frames 
      ${train.processed_frames} --model ${train.model}
    deps:
    - ml/training/train_action_frequency.py
    - ${train.processed_frames}
    outs:
    - ${train.model}
  evaluate:
    cmd: python ml/evaluation/evaluate_action_frequency.py --frames 
      ${evaluate.processed_frames} --model ${evaluate.model} --metrics 
      ${evaluate.metrics} --report ${evaluate.report}
    deps:
    - ml/evaluation/evaluate_action_frequency.py
    - ${evaluate.processed_frames}
    - ${evaluate.model}
    metrics:
    - ${evaluate.metrics}
    outs:
    - ${evaluate.report}
params:
- dvclive/params.yaml
metrics:
- dvclive/metrics.json
plots:
- dvclive/plots/metrics:
    x: step
artifacts:
  run_summary:
    path: experiments/runs/run_000023/summary.json
    type: json
  run_metadata:
    path: experiments/runs/run_000023/metadata.json
    type: json
