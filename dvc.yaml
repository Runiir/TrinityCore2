stages:
  world_knowledge:
    cmd: python -m tools.bot_ml.extract_world_knowledge --output-dir
      dataset/world_knowledge
    deps:
    - tools/bot_ml/extract_world_knowledge.py
    - tools/bot_ml/common.py
    outs:
    - dataset/world_knowledge:
        persist: true
  world_planner:
    cmd: python -m tools.bot_ml.build_world_planner_manifests --world-dir
      dataset/world_knowledge --output-dir dataset/world_planner
    deps:
    - tools/bot_ml/build_world_planner_manifests.py
    - tools/bot_ml/common.py
    - dataset/world_knowledge
    outs:
    - dataset/world_planner:
        persist: true
  world_planner_validate:
    cmd: python -m tools.bot_ml.validate_world_planner --planner-dir
      dataset/world_planner --validation-scenario-dir
      dataset/validation_scenarios --live-scenario-report-dir
      dataset/live_validation_scenario_reports_built --report
      dataset/world_validation/planner_report.json
    deps:
    - tools/bot_ml/validate_world_planner.py
    - tools/bot_ml/common.py
    - dataset/world_planner
    - dataset/validation_scenarios
    - dataset/live_validation_scenario_reports_built
    metrics:
    - dataset/world_validation/planner_report.json:
        cache: false
  quest_profession_report:
    cmd: python -m tools.bot_ml.build_quest_profession_reports --planner-dir
      dataset/world_planner --report
      dataset/quest_profession_reports/report.json
    deps:
    - tools/bot_ml/build_quest_profession_reports.py
    - tools/bot_ml/validate_world_planner.py
    - tools/bot_ml/common.py
    - dataset/world_planner
    metrics:
    - dataset/quest_profession_reports/report.json:
        cache: false
  validation_gear:
    cmd: python -m tools.bot_ml.build_validation_gear_profiles --config
      experiments/configs/validation_provisioning_cata_001.json --output-dir
      dataset/validation_gear_profiles
    deps:
    - tools/bot_ml/build_validation_gear_profiles.py
    - tools/bot_ml/build_validation_provisioning.py
    - tools/bot_ml/validation_profile_manifests.py
    - tools/bot_ml/extract_world_knowledge.py
    - experiments/configs/validation_provisioning_cata_001.json
    - experiments/configs/all_spec_targets_cata_p4_v1.json
    - experiments/configs/cata_434_combat_loot_profiles.json
    - data/dbc/enUS/Item.db2
    - data/dbc/enUS/Item-sparse.db2
    - data/dbc/enUS/SpellItemEnchantment.dbc
    - data/dbc/enUS/GemProperties.dbc
    outs:
    - dataset/validation_gear_profiles:
        persist: true
  validation_provisioning:
    cmd: python -m tools.bot_ml.build_validation_provisioning --config
      experiments/configs/validation_provisioning_cata_001.json --gear-profiles
      dataset/validation_gear_profiles/profiles.json --output-dir
      dataset/validation_provisioning
    deps:
    - tools/bot_ml/build_validation_provisioning.py
    - tools/bot_ml/validation_profile_manifests.py
    - experiments/configs/validation_provisioning_cata_001.json
    - experiments/configs/all_spec_targets_cata_p4_v1.json
    - experiments/configs/cata_434_action_profiles.json
    - data/dbc/enUS/Talent.dbc
    - data/dbc/enUS/TalentTreePrimarySpells.dbc
    - data/dbc/enUS/GlyphProperties.dbc
    - dataset/validation_gear_profiles
    outs:
    - dataset/validation_provisioning:
        persist: true
  baseline_inventory:
    cmd: python -m tools.bot_ml.build_baseline_inventory --output-dir
      dataset/baseline_inventory
    deps:
    - tools/bot_ml/build_baseline_inventory.py
    - tools/bot_ml/extract_world_knowledge.py
    - experiments/configs/bot_acceptance_policy_v1.json
    - experiments/configs/baseline_dvc_pointer_inventory_v1.json
    - experiments/configs/validation_provisioning_cata_001.json
    - experiments/configs/all_spec_targets_cata_p4_v1.json
    - experiments/configs/cata_434_action_profiles.json
    - experiments/configs/validation_scenarios_cata_001.json
    - dataset/validation_gear_profiles/profiles.json
    - dataset/validation_scenarios/validation_routes.jsonl
    - dataset/validation_run_plan/run_validation_scenarios.sh
    - sql/custom/world/2026_06_21_00_bot_rotation_profiles.sql
    - sql/custom/world/2026_07_02_00_bwd_blood_dk_tank_profile.sql
    - sql/custom/world/2026_07_02_01_bwd_tank_threat_profiles.sql
    - sql/custom/world/2026_07_02_02_bwd_healer_triage_profiles.sql
    - sql/custom/world/2026_07_14_00_stonecore_rotation_liveness.sql
    - sql/custom/world/2026_07_14_01_stonecore_role_efficiency.sql
    - sql/custom/world/2026_07_14_02_holy_priest_prayer_of_mending_aura_guard.sql
    - sql/custom/world/2026_07_14_03_stonecore_paladin_aoe_threat_priority.sql
    - sql/custom/world/2026_07_14_04_marksmanship_cast_time_stationary.sql
    - sql/custom/world/2026_07_15_00_stonecore_complete_role_rotations.sql
    - sql/custom/world/2026_07_15_01_stonecore_emergency_add_threat.sql
    - sql/custom/world/2026_07_15_02_stonecore_hunter_rotation_liveness.sql
    - sql/custom/world/2026_07_16_00_stonecore_wowhead_guide_rotations.sql
    - sql/custom/world/2026_07_16_01_stonecore_holy_priest_serenity.sql
    - sql/custom/world/2026_07_16_02_stonecore_holy_word_serenity_cast.sql
    - sql/custom/world/2026_07_16_03_dummy_dps_rotation_tuning.sql
    - sql/custom/world/2026_07_16_04_dummy_dps_rotation_followup.sql
    - sql/custom/world/2026_07_16_05_dummy_dps_aura_refresh.sql
    - sql/custom/world/2026_07_16_06_protection_single_target_fillers.sql
    - sql/custom/world/2026_07_16_07_enhancement_fire_elemental.sql
    - sql/custom/world/2026_07_17_00_enhancement_searing_priority.sql
    - sql/custom/world/2026_07_17_01_enhancement_unleash_flame_priority.sql
    - sql/custom/world/2026_07_17_01_protection_avenging_wrath.sql
    - sql/custom/world/2026_07_17_02_enhancement_unleash_flame_rollback.sql
    outs:
    - dataset/baseline_inventory:
        persist: true
  all_spec_phase1_catalogs:
    cmd: python -m tools.bot_ml.build_all_spec_phase1_catalogs --output-dir
      dataset/all_spec_phase1_catalogs
    deps:
    - tools/bot_ml/build_all_spec_phase1_catalogs.py
    - tools/bot_ml/build_validation_provisioning.py
    - experiments/configs/all_spec_targets_cata_p4_v1.json
    - experiments/configs/all_spec_references_cata_p4_v1.json
    - experiments/configs/all_spec_calibration_scenarios_v1.json
    - experiments/configs/stonecore_pairwise_constraints_v1.json
    - experiments/configs/validation_provisioning_cata_001.json
    - experiments/configs/cata_434_action_profiles.json
    - experiments/configs/cata_434_combat_loot_profiles.json
    - sql/custom/world/2026_07_18_00_all_spec_rotation_profile_coverage.sql
    - data/dbc/enUS/Talent.dbc
    - data/dbc/enUS/TalentTreePrimarySpells.dbc
    outs:
    - dataset/all_spec_phase1_catalogs:
        persist: true
  all_spec_phase2_evidence_contract:
    cmd: python -m tools.bot_ml.live_validation_session --output-dir
      dataset/all_spec_phase2_evidence_contract
    deps:
    - tools/bot_ml/live_validation_session.py
    - tools/bot_ml/run_live_bot_validation.py
    - tools/bot_ml/build_live_scenario_reports.py
    - tools/bot_ml/promote_live_validation_artifact.py
    - experiments/configs/all_spec_targets_cata_p4_v1.json
    - experiments/configs/all_spec_references_cata_p4_v1.json
    - experiments/configs/all_spec_calibration_scenarios_v1.json
    - experiments/configs/stonecore_pairwise_constraints_v1.json
    - experiments/configs/validation_provisioning_cata_001.json
    - experiments/configs/bot_acceptance_policy_v1.json
    - experiments/configs/validation_scenarios_cata_001.json
    - dataset/validation_gear_profiles/profiles.json
    - dataset/validation_scenarios/validation_routes.jsonl
    outs:
    - dataset/all_spec_phase2_evidence_contract:
        persist: true
  all_spec_phase3_batch_lifecycle:
    cmd: python -m tools.bot_ml.batch_evidence_lifecycle --output-dir
      dataset/all_spec_phase3_batch_lifecycle
    deps:
    - tools/bot_ml/batch_evidence_lifecycle.py
    - tools/bot_ml/live_validation_session.py
    - tools/bot_ml/run_live_bot_validation.py
    outs:
    - dataset/all_spec_phase3_batch_lifecycle:
        persist: true
  validation_provisioning_verify:
    cmd: python -m tools.bot_ml.validate_validation_provisioning --config
      experiments/configs/validation_provisioning_cata_001.json --gear-profiles
      dataset/validation_gear_profiles/profiles.json --provisioning-report
      dataset/validation_provisioning/report.json --output
      dataset/validation_provisioning_verification/report.json
    deps:
    - tools/bot_ml/validate_validation_provisioning.py
    - tools/bot_ml/build_validation_gear_profiles.py
    - tools/bot_ml/build_validation_provisioning.py
    - tools/bot_ml/validation_profile_manifests.py
    - tools/bot_ml/extract_world_knowledge.py
    - experiments/configs/validation_provisioning_cata_001.json
    - experiments/configs/all_spec_targets_cata_p4_v1.json
    - experiments/configs/cata_434_action_profiles.json
    - experiments/configs/cata_434_combat_loot_profiles.json
    - dataset/validation_gear_profiles
    - dataset/validation_provisioning/report.json
    - data/dbc/enUS/Item.db2
    - data/dbc/enUS/Item-sparse.db2
    - data/dbc/enUS/SpellItemEnchantment.dbc
    - data/dbc/enUS/GemProperties.dbc
    metrics:
    - dataset/validation_provisioning_verification/report.json:
        cache: false
  validation_scenarios:
    cmd: python -m tools.bot_ml.build_validation_scenario_manifests --config
      experiments/configs/validation_scenarios_cata_001.json
      --provisioning-report dataset/validation_provisioning/report.json
      --provisioning-verification
      dataset/validation_provisioning_verification/report.json --output-dir
      dataset/validation_scenarios
    deps:
    - tools/bot_ml/build_validation_scenario_manifests.py
    - tools/bot_ml/common.py
    - experiments/configs/validation_scenarios_cata_001.json
    - dataset/validation_provisioning/report.json
    - dataset/validation_provisioning_verification/report.json
    outs:
    - dataset/validation_scenarios:
        persist: true
  live_scenario_reports:
    cmd: python -m tools.bot_ml.build_live_scenario_reports --live-report
      dataset/live_validation_scenarios/stonecore_5n/report.json
      --live-report
      dataset/live_validation_scenarios/stonecore_5n/01_entrance_packs/report.json
      --live-report
      dataset/live_validation_scenarios/stonecore_5n/02_corborus/report.json
      --live-report
      dataset/live_validation_scenarios/stonecore_5n/03_crystalspawn_corridor/report.json
      --live-report
      dataset/live_validation_scenarios/stonecore_5n/04_slabhide/report.json
      --live-report
      dataset/live_validation_scenarios/stonecore_5n/05_stonecore_sentry_gauntlet/report.json
      --live-report
      dataset/live_validation_scenarios/stonecore_5n/06_ozruk/report.json
      --live-report
      dataset/live_validation_scenarios/stonecore_5n/07_twilight_flayer_packs/report.json
      --live-report
      dataset/live_validation_scenarios/stonecore_5n/08_high_priestess_azil/report.json
      --validation-scenario-dir dataset/validation_scenarios --output-dir
      dataset/live_validation_scenario_reports_built
    deps:
    - tools/bot_ml/build_live_scenario_reports.py
    - tools/bot_ml/run_live_bot_validation.py
    - tools/bot_ml/common.py
    - dataset/live_validation_scenarios/stonecore_5n/report.json
    - dataset/live_validation_scenarios/stonecore_5n/01_entrance_packs/report.json
    - dataset/live_validation_scenarios/stonecore_5n/02_corborus/report.json
    - dataset/live_validation_scenarios/stonecore_5n/03_crystalspawn_corridor/report.json
    - dataset/live_validation_scenarios/stonecore_5n/04_slabhide/report.json
    - dataset/live_validation_scenarios/stonecore_5n/05_stonecore_sentry_gauntlet/report.json
    - dataset/live_validation_scenarios/stonecore_5n/06_ozruk/report.json
    - dataset/live_validation_scenarios/stonecore_5n/07_twilight_flayer_packs/report.json
    - dataset/live_validation_scenarios/stonecore_5n/08_high_priestess_azil/report.json
    - dataset/validation_scenarios
    outs:
    - dataset/live_validation_scenario_reports_built:
        persist: true
  validation_run_plan:
    cmd: python -m tools.bot_ml.build_validation_run_plan
      --validation-scenario-dir dataset/validation_scenarios --output-dir
      dataset/validation_run_plan --live-output-root
      dataset/live_validation_scenarios --scenario-report-root
      dataset/live_validation_scenario_reports_built
    deps:
    - tools/bot_ml/build_validation_run_plan.py
    - tools/bot_ml/common.py
    - dataset/validation_scenarios
    outs:
    - dataset/validation_run_plan:
        persist: true
  validation_run_status:
    cmd: python -m tools.bot_ml.build_validation_run_status --run-plan
      dataset/validation_run_plan/manifest.json --scenario-report-root
      dataset/live_validation_scenario_reports_built --output-dir
      dataset/validation_run_status
    deps:
    - tools/bot_ml/build_validation_run_status.py
    - tools/bot_ml/common.py
    - dataset/validation_run_plan/manifest.json
    - dataset/live_validation_scenario_reports_built
    outs:
    - dataset/validation_run_status:
        persist: true
  live_validation_combined:
    cmd: python -m tools.bot_ml.run_live_bot_validation --input-log
      artifacts/live_validation_quest_mob_assist_150s/worldserver_output.log
      --scenario-report-dir dataset/live_validation_scenario_reports_built
      --output-dir dataset/live_validation_combined
    deps:
    - tools/bot_ml/run_live_bot_validation.py
    - artifacts/live_validation_quest_mob_assist_150s/worldserver_output.log
    - dataset/live_validation_scenario_reports_built
    outs:
    - dataset/live_validation_combined:
        persist: true
  bot_ml_build_decisions:
    # Materializes dataset/bot_ml/decision_dataset.jsonl from dataset/bot_ml/raw.
    cmd: python -m tools.bot_ml.build_decision_dataset --input-dir
      ${bot_ml.raw_dir} --output ${bot_ml.decision_dataset} --manifest
      ${bot_ml.decision_manifest} --include-map-id ${bot_ml.teacher_map_id}
    deps:
    - tools/bot_ml/build_decision_dataset.py
    - tools/bot_ml/common.py
    - ${bot_ml.raw_dir}
    outs:
    - ${bot_ml.decision_dataset}
    - ${bot_ml.decision_manifest}
  bot_ml_validate:
    # Writes dataset/bot_ml/data_quality.json quality metrics.
    cmd: python -m tools.bot_ml.validate_data_quality --dataset
      ${bot_ml.decision_dataset} --report ${bot_ml.data_quality_report}
    deps:
    - tools/bot_ml/validate_data_quality.py
    - tools/bot_ml/common.py
    - ${bot_ml.decision_dataset}
    metrics:
    - ${bot_ml.data_quality_report}:
        cache: false
  bot_ml_train:
    cmd: python -m tools.bot_ml.train_policy_model --dataset
      ${bot_ml.decision_dataset} --model ${bot_ml.model} --model-dir
      ${bot_ml.model_dir} --live-dir ${bot_ml.live_train_dir}
    deps:
    - tools/bot_ml/train_policy_model.py
    - tools/bot_ml/model_artifacts.py
    - tools/bot_ml/common.py
    - ${bot_ml.decision_dataset}
    outs:
    - ${bot_ml.model}
    - ${bot_ml.model_dir}:
        persist: true
    - ${bot_ml.live_train_dir}:
        persist: true
  bot_ml_evaluate:
    # Writes evaluations/bot_policy/metrics.json and diagnostics.
    cmd: python -m tools.bot_ml.evaluate_policy_model --dataset
      ${bot_ml.decision_dataset} --model ${bot_ml.model} --metrics
      ${bot_ml.metrics} --diagnostics ${bot_ml.diagnostics} --live-dir
      ${bot_ml.live_eval_dir}
    deps:
    - tools/bot_ml/evaluate_policy_model.py
    - tools/bot_ml/model_artifacts.py
    - tools/bot_ml/common.py
    - ${bot_ml.decision_dataset}
    - ${bot_ml.model}
    metrics:
    - ${bot_ml.metrics}:
        cache: false
    outs:
    - ${bot_ml.diagnostics}
    - ${bot_ml.live_eval_dir}:
        persist: true
  bot_ml_register:
    cmd: python -m tools.bot_ml.register_policy_model --model
      ${bot_ml.model} --metrics ${bot_ml.metrics} --diagnostics
      ${bot_ml.diagnostics} --sql-output ${bot_ml.register_sql}
    deps:
    - tools/bot_ml/register_policy_model.py
    - tools/bot_ml/common.py
    - ${bot_ml.model}
    - ${bot_ml.metrics}
    - ${bot_ml.diagnostics}
    outs:
    - ${bot_ml.register_sql}
    - models/bot_policy/register_model.json
  bt_masked_ga_combined:
    cmd: python -m tools.bot_ml.bt_masked_ga_combined --dataset
      ${bot_ml.decision_dataset} --output-dir ${bt_masked_ga_combined.output_dir}
      --baseline-report ${bt_masked_ga_combined.baseline_report} --population-size
      ${bt_masked_ga_combined.population_size} --generations
      ${bt_masked_ga_combined.generations} --seed ${bt_masked_ga_combined.seed}
    deps:
    - tools/bot_ml/bt_masked_ga_combined.py
    - tools/bot_ml/common.py
    - ${bot_ml.decision_dataset}
    - ${bt_masked_ga_combined.baseline_report}
    params:
    - bt_masked_ga_combined
    metrics:
    - ${bt_masked_ga_combined.output_dir}/metrics.json:
        cache: false
    - ${bt_masked_ga_combined.output_dir}/stonecore_baseline_comparison.json:
        cache: false
    outs:
    - ${bt_masked_ga_combined.output_dir}/model.json
    - ${bt_masked_ga_combined.output_dir}/diagnostics.json
    - ${bt_masked_ga_combined.output_dir}/ga_strategy_knobs.json
    - ${bt_masked_ga_combined.output_dir}/ga_history.json
    - ${bt_masked_ga_combined.output_dir}/report.json
    - ${bt_masked_ga_combined.output_dir}/dvclive:
        persist: true
  capture:
    cmd: python experiments/run_experiment.py ${capture.config} --raw-dir
      dataset/raw --runs-dir experiments/runs --live-dir ${tracking.live_dir}
      --local
    deps:
    - experiments/run_experiment.py
    - ${capture.config}
    outs:
    - dataset/raw:
        persist: true
    - experiments/runs:
        persist: true
    - ${tracking.live_dir}:
        persist: true
  preprocess:
    cmd: python ml/preprocessing/preprocess_frames.py --raw-dir
      ${preprocess.raw_dir} --output ${preprocess.output} --manifest
      ${preprocess.manifest}
    deps:
    - ml/preprocessing/preprocess_frames.py
    - ${preprocess.raw_dir}
    outs:
    - ${preprocess.output}
    - ${preprocess.manifest}
  train:
    cmd: python ml/training/train_action_frequency.py --frames
      ${train.processed_frames} --model ${train.model}
    deps:
    - ml/training/train_action_frequency.py
    - ${train.processed_frames}
    outs:
    - ${train.model}
  evaluate:
    cmd: python ml/evaluation/evaluate_action_frequency.py --frames
      ${evaluate.processed_frames} --model ${evaluate.model} --metrics
      ${evaluate.metrics} --report ${evaluate.report}
    deps:
    - ml/evaluation/evaluate_action_frequency.py
    - ${evaluate.processed_frames}
    - ${evaluate.model}
    metrics:
    - ${evaluate.metrics}
    outs:
    - ${evaluate.report}
params:
- dvclive/params.yaml
metrics:
- dvclive/metrics.json
plots:
- dvclive/plots/metrics:
    x: step
artifacts:
  run_summary:
    path: experiments/runs/run_000028/summary.json
    type: json
  run_metadata:
    path: experiments/runs/run_000028/metadata.json
    type: json
