stages:
  world_knowledge:
    cmd: python -m tools.bot_ml.extract_world_knowledge --output-dir
      dataset/world_knowledge
    deps:
    - tools/bot_ml/extract_world_knowledge.py
    - tools/bot_ml/common.py
    outs:
    - dataset/world_knowledge:
        persist: true
  world_planner:
    cmd: python -m tools.bot_ml.build_world_planner_manifests --world-dir
      dataset/world_knowledge --output-dir dataset/world_planner
    deps:
    - tools/bot_ml/build_world_planner_manifests.py
    - tools/bot_ml/common.py
    - dataset/world_knowledge
    outs:
    - dataset/world_planner:
        persist: true
  world_planner_validate:
    cmd: python -m tools.bot_ml.validate_world_planner --planner-dir
      dataset/world_planner --validation-scenario-dir
      dataset/validation_scenarios --live-scenario-report-dir
      dataset/live_validation_scenario_reports_built --report
      dataset/world_validation/planner_report.json
    deps:
    - tools/bot_ml/validate_world_planner.py
    - tools/bot_ml/common.py
    - dataset/world_planner
    - dataset/validation_scenarios
    - dataset/live_validation_scenario_reports_built
    metrics:
    - dataset/world_validation/planner_report.json:
        cache: false
  quest_profession_report:
    cmd: python -m tools.bot_ml.build_quest_profession_reports --planner-dir
      dataset/world_planner --report
      dataset/quest_profession_reports/report.json
    deps:
    - tools/bot_ml/build_quest_profession_reports.py
    - tools/bot_ml/validate_world_planner.py
    - tools/bot_ml/common.py
    - dataset/world_planner
    metrics:
    - dataset/quest_profession_reports/report.json:
        cache: false
  validation_gear:
    cmd: python -m tools.bot_ml.build_validation_gear_profiles --config
      experiments/configs/validation_provisioning_cata_001.json --output-dir
      dataset/validation_gear_profiles
    deps:
    - tools/bot_ml/build_validation_gear_profiles.py
    - tools/bot_ml/build_validation_provisioning.py
    - tools/bot_ml/validation_profile_manifests.py
    - tools/bot_ml/extract_world_knowledge.py
    - experiments/configs/validation_provisioning_cata_001.json
    - experiments/configs/all_spec_targets_cata_p4_v1.json
    - experiments/configs/cata_434_combat_loot_profiles.json
    - data/dbc/enUS/Item.db2
    - data/dbc/enUS/Item-sparse.db2
    - data/dbc/enUS/SpellItemEnchantment.dbc
    - data/dbc/enUS/GemProperties.dbc
    - data/dbc/enUS/ItemLimitCategory.dbc
    outs:
    - dataset/validation_gear_profiles:
        persist: true
  validation_provisioning:
    cmd: python -m tools.bot_ml.build_validation_provisioning --config
      experiments/configs/validation_provisioning_cata_001.json --gear-profiles
      dataset/validation_gear_profiles/profiles.json --bwd-diagnostic-shard-fixture
      experiments/configs/cata_raid_bwd_diagnostic_shards_v1.json --dbc-dir data/dbc/enUS --output-dir
      dataset/validation_provisioning
    deps:
    - tools/bot_ml/build_validation_provisioning.py
    - tools/bot_ml/validation_profile_manifests.py
    - tools/raid_program/bwd_shard_fixtures.py
    - experiments/configs/validation_provisioning_cata_001.json
    - experiments/configs/cata_raid_bwd_diagnostic_shards_v1.json
