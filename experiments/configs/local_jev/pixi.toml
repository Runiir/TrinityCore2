[workspace]
name = "trinity-local-jev"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.13.*"
pip = "*"

[pypi-dependencies]
simple-jev = { path = "hf-server", editable = true }
torch = "==2.9.1"

[tasks]
serve = "python hf-server/hf_server.py --model Qwen/Qwen3.5-0.8B --device cuda --dtype float16 --max-model-len 8192 --max-batch-size 1 --max-batch-tokens 8192 --host 127.0.0.1 --port 8000"
