[workspace]
authors = ["Runiir <runiir.beltran@gmail.com>"]
channels = ["conda-forge"]
name = "trinity-cata"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
dvc-status = "dvc status"
dvc-repro = "dvc repro"
dvc-exp-run = "dvc exp run"
dvc-exp-show = "dvc exp show"
dvc-push = "dvc push"
dvc-pull = "dvc pull"
test = "pytest"
bot-ml-export = "python -m tools.bot_ml.export_bot_dataset"
bot-world-knowledge = "python -m tools.bot_ml.extract_world_knowledge"
bot-world-planner = "python -m tools.bot_ml.build_world_planner_manifests"
bot-world-validate = "python -m tools.bot_ml.validate_world_planner"
bot-quest-profession-report = "python -m tools.bot_ml.build_quest_profession_reports"
bot-validation-gear = "python -m tools.bot_ml.build_validation_gear_profiles"
bot-validation-provisioning = "python -m tools.bot_ml.build_validation_provisioning"
bot-validation-provisioning-verify = "python -m tools.bot_ml.validate_validation_provisioning"
bot-validation-scenarios = "python -m tools.bot_ml.build_validation_scenario_manifests"
bot-validation-run-plan = "python -m tools.bot_ml.build_validation_run_plan"
bot-validation-run-status = "python -m tools.bot_ml.build_validation_run_status"
bot-lane-configs = "python -m tools.bot_ml.generate_lane_configs"
bot-live-scenario-reports = "python -m tools.bot_ml.build_live_scenario_reports"
bot-live-validate = "python -m tools.bot_ml.run_live_bot_validation"
bot-ml-build-decisions = "python -m tools.bot_ml.build_decision_dataset"
bot-ml-validate = "python -m tools.bot_ml.validate_data_quality"
bot-ml-train = "python -m tools.bot_ml.train_policy_model"
bot-ml-evaluate = "python -m tools.bot_ml.evaluate_policy_model"
bot-ml-explain = "python -m tools.bot_ml.explain_run"
bot-ml-compare = "python -m tools.bot_ml.replay_compare_report"
bot-ml-register = "python -m tools.bot_ml.register_policy_model"
experiment-smoke = "python experiments/run_experiment.py experiments/configs/headless_playerbot_smoke_001.json --local"
movement-smoke = "python experiments/run_experiment.py experiments/configs/headless_movement_smoke_001.json --local"
combat-smoke = "python experiments/run_experiment.py experiments/configs/headless_solo_combat_smoke_001.json --local"
full-party-smoke = "python experiments/run_experiment.py experiments/configs/full_party_trash_pull_001.json --local"
dungeon-segment-smoke = "python experiments/run_experiment.py experiments/configs/dungeon_segment_tot_basic_001.json --local"
profession-smoke = "python experiments/run_experiment.py experiments/configs/headless_profession_cooking_smoke_001.json --local"
autonomous-smoke = "python experiments/run_experiment.py experiments/configs/headless_autonomous_loop_smoke_001.json --local"
setup-dvc-s3 = "python scripts/setup_dvc_s3_remote.py"

[dependencies]
dvc = ">=3.67.1,<4"
dvclive = ">=3.49.0,<4"
dvc-s3 = ">=3.3.0,<4"
pytest = ">=9.0.3,<10"
pymysql = ">=1.1.2,<2"
pyarrow = ">=22.0.0,<23"
xgboost = ">=3.0.0,<4"
